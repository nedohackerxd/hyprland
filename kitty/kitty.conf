# ==============================================================================
# 1. ШРИФТЫ (FONTS)
# ==============================================================================
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

disable_ligatures never

# ==============================================================================
# 2. ОФОРМЛЕНИЕ И ПРОЗРАЧНОСТЬ (WINDOW & OPACITY)
# ==============================================================================
# Полупрозрачность окна (хорошо смотрится с размытием KWin в KDE)
background_opacity 0.88

# Отступы внутри окна терминала
window_padding_width 10

# Отключение системного заголовка окна (управляется KWin в KDE)
hide_window_decorations no

# Частота обновления экрана и устранение разрывов
sync_to_monitor yes

# Предотвращение писка при ошибках
enable_audio_bell no

# ==============================================================================
# 3. ЦВЕТОВАЯ ПАЛИТРА (CATPPUCCIN MOCHA)
# ==============================================================================
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# КУРСОР
cursor                  #F5E0DC
cursor_text_color       #1E1E2E
cursor_shape            beam
cursor_blink_interval   0.5

# ВАЛЮТА / URL
url_color               #F5E0DC

# ЦВЕТА РАМОК ОКНА
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# ТАБЫ (ВКЛАДКИ)
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# 16 ОСНОВНЫХ ЦВЕТОВ TERMINAL
# Black
color0 #45475A
color8 #585B70

# Red
color1 #F38BA8
color9 #F38BA8

# Green
color2  #A6E3A1
color10 #A6E3A1

# Yellow
color3  #F9E2AF
color11 #F9E2AF

# Blue
color4  #89B4FA
color12 #89B4FA

# Magenta
color5  #F5C2E7
color13 #F5C2E7

# Cyan
color6  #94E2D5
color14 #94E2D5

# White
color7  #BAC2DE
color15 #A6ADC8

# ==============================================================================
# 4. ВЫДЕЛЕНИЕ И БУФЕР ОБМЕНА
# ==============================================================================
copy_on_select yes
strip_trailing_spaces always

# ==============================================================================
# 5. ГОРЯЧИЕ КЛАВИШИ (KEYBINDINGS)
# ==============================================================================
# Изменение размера шрифта
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Управление вкладками
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+tab     next_tab
map ctrl+shift+tab previous_tab

# Разделение окон (Splits)
map ctrl+shift+enter launch --cwd=current --location=vsplit
map ctrl+shift+d     launch --cwd=current --location=hsplit
